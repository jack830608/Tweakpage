<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora — demo</title>
<style>
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .hero { min-height: 100vh; background: linear-gradient(135deg, #1f2933, #0b1220); color: #fff;
          display: flex; flex-direction: column; justify-content: center; padding: 0 88px; gap: 18px; }
  h1 { font-size: 60px; margin: 0; letter-spacing: -0.02em; }
  .accent { color: #ff3b30; }
  p.lead { font-size: 20px; line-height: 1.6; color: #cbd5e1; max-width: 540px; margin: 0; }
  .cta { background: #ff3b30; color: #fff; border: none; padding: 14px 30px; border-radius: 8px;
         font-size: 16px; font-weight: 600; width: fit-content; cursor: pointer; }
</style>
</head>
<body>
  <section class="hero">
    <h1>Make the page <span class="accent">yours</span></h1>
    <p class="lead">Tweak copy, colors, spacing and images on any site — no code, no waiting. Hand engineers a clean change list when you're done.</p>
    <button class="cta">Get started</button>
  </section>
</body>
</html>
