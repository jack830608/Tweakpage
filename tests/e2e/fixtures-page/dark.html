<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dark</title>
<style>
  body { margin:0; background:#0b0b0d; color:#eee; font:16px/1.5 system-ui; padding:40px; }
  .card { background:#16161a; border:1px solid #26262c; border-radius:14px; padding:20px; max-width:520px; margin-bottom:16px; }
  .cta { background:#059669; color:#fff; border:none; border-radius:10px; padding:12px 20px; font-size:15px; }
  .green-band { background:#065f46; padding:18px; border-radius:10px; margin-bottom:16px; max-width:520px; }
  .photo { width:520px; height:120px; border-radius:10px; background:
    linear-gradient(115deg,#7c3aed,#059669 40%,#f59e0b 70%,#ef4444); margin-bottom:16px; }
</style></head>
<body>
  <h1 id="dark-title">Dark page</h1>
  <div class="card"><p id="on-card">A paragraph on a dark card.</p></div>
  <div class="green-band"><p id="on-green">Text on a green band — the accent's own colour.</p></div>
  <div class="photo" id="on-photo"></div>
  <button class="cta" id="cta">Get started</button>
</body></html>
